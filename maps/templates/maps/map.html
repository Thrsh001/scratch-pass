{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch Pass</title>
  <link rel="stylesheet" href="{% static 'css/map.css' %}">
</head>
<body>
  <div class="map-shell">
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="top-bar-username">{{ user.username }}</span>
      </div>
      <div class="top-bar-center">
        <span class="visited-count" data-visited-count>0 countries visited</span>
      </div>
      <div class="top-bar-right">
        <form method="post" action="{% url 'logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit">Log out</button>
        </form>
      </div>
    </header>
    <svg class="world-map" viewBox="0 0 1000 500" role="img" aria-label="World map">
      {% include "maps/partials/world.svg" %}
      <!-- Subdivision drill-down (redefined): rendered in the SAME
           coordinate space as world.svg (same projection formula), so
           clicking a country zooms in on it in place rather than swapping
           to a separate view — neighbors stay visible. One <g> per
           drillable country, hidden until map.js swaps it in. Only Italy
           exists so far; this'll need to become a loop once a second
           country gets subdivisions. -->
      <g class="subdivision-group" data-country="IT" hidden>
        {% include "maps/partials/subdivisions/it.svg" %}
      </g>
    </svg>
    <!-- Plain text hint for now — may become a real clickable button
         (an explicit tap-to-exit affordance) instead of a pure gesture
         hint, if double-click/tap alone doesn't prove discoverable enough. -->
    <div class="drilldown-hint" data-drilldown-hint hidden>Double click/tap to return</div>
  </div>
  <script src="{% static 'js/map.js' %}"></script>
</body>
</html>
