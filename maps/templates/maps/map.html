{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch Pass</title>
  <link rel="stylesheet" href="{% static 'css/map.css' %}">
</head>
<body>
  <div class="map-shell">
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="top-bar-username">{{ user.username }}</span>
      </div>
      <div class="top-bar-center">
        <span class="visited-count" data-visited-count>0 countries visited</span>
      </div>
      <div class="top-bar-right">
        <form method="post" action="{% url 'logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit">Log out</button>
        </form>
      </div>
    </header>
    <svg class="world-map" viewBox="0 0 1000 500" role="img" aria-label="World map">
      {% include "maps/partials/world.svg" %}
      <!-- Subdivision drill-down: a country's regions render in the SAME
           coordinate space as world.svg (same projection formula), so
           clicking it zooms in on it in place rather than swapping to a
           separate view — neighbors stay visible. Each country's
           <g class="subdivision-group" data-country="XX"> is created and
           populated by map.js on first drill-down (fetched from
           /api/subdivisions/<code>/, not inlined here) rather than shipping
           every subdivided country's geometry on every page load (SP-13.3). -->
    </svg>
    <button type="button" class="drilldown-hint" data-drilldown-hint hidden>Return to world view</button>
    <!-- Region info popup (SP-18.2): one element, a docked card on wide
         screens and a bottom sheet on narrow ones (CSS media query).
         Descriptions are lazy-loaded per country from the static JSON
         written by fetch_region_descriptions (SP-18.1). -->
    <section class="region-panel" role="dialog" aria-labelledby="region-panel-title"
             data-region-panel data-descriptions-url="{% get_static_prefix %}data/descriptions/" hidden>
      <button type="button" class="region-panel-close" data-region-panel-close aria-label="Close">&times;</button>
      <h2 class="region-panel-title" id="region-panel-title" data-region-panel-title></h2>
      <p class="region-panel-extract" data-region-panel-extract hidden></p>
      <p class="region-panel-source" data-region-panel-source hidden>
        <a data-region-panel-link target="_blank" rel="noopener">Read more on Wikipedia</a>
        <span class="region-panel-license">Text from Wikipedia,
          <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener license">CC BY-SA 4.0</a></span>
      </p>
      <button type="button" class="region-panel-action" data-region-panel-action></button>
    </section>
  </div>
  <script src="{% static 'js/map.js' %}"></script>
</body>
</html>
