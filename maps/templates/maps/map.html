{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch Pass</title>
  <link rel="stylesheet" href="{% static 'css/map.css' %}">
</head>
<body>
  <div class="map-shell">
    <header class="map-overlay">
      <h1>Scratch Pass</h1>
      <p class="tagline">Scratch off every place you've been.</p>
    </header>
    <svg class="world-map" viewBox="0 0 1000 500" role="img" aria-label="World map">
      {% include "maps/partials/world.svg" %}
      <!-- Future subdivision ids will look like "IT:TO". -->
    </svg>
  </div>
  <script src="{% static 'js/map.js' %}"></script>
</body>
</html>
