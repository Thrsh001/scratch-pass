{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch Pass</title>
  <link rel="stylesheet" href="{% static 'css/map.css' %}">
</head>
<body>
  <div class="map-shell">
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="top-bar-username">{{ user.username }}</span>
      </div>
      <div class="top-bar-center">
        <span class="visited-count" data-visited-count>0 countries visited</span>
      </div>
      <div class="top-bar-right">
        <form method="post" action="{% url 'logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit">Log out</button>
        </form>
      </div>
    </header>
    <svg class="world-map" viewBox="0 0 1000 500" role="img" aria-label="World map">
      {% include "maps/partials/world.svg" %}
      <!-- Subdivision drill-down: a country's regions render in the SAME
           coordinate space as world.svg (same projection formula), so
           clicking it zooms in on it in place rather than swapping to a
           separate view — neighbors stay visible. Each country's
           <g class="subdivision-group" data-country="XX"> is created and
           populated by map.js on first drill-down (fetched from
           /api/subdivisions/<code>/, not inlined here) rather than shipping
           every subdivided country's geometry on every page load (SP-13.3). -->
    </svg>
    <button type="button" class="drilldown-hint" data-drilldown-hint hidden>Return to world view</button>
  </div>
  <script src="{% static 'js/map.js' %}"></script>
</body>
</html>
